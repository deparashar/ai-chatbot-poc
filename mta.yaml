_schema-version: "3.1"
ID: fiori-chat-poc
description: Fiori AI Chatbot with SAP OData MCP Server — Client POC
version: 1.0.0

parameters:
  enable-parallel-deployments: true

modules:

  # ── MCP Server (SAP OData → MCP bridge) ─────────────────────────────────────
  - name: sap-mcp-server
    type: nodejs
    path: sap-mcp-server
    parameters:
      app-name: sap-mcp-server-${space}
      memory: 512M
      disk-quota: 1G
      buildpack: nodejs_buildpack
      command: npm run start
      health-check-type: http
      health-check-http-endpoint: /health
      timeout: 180
    properties:
      LOG_LEVEL: info
      # After deploy, set via cf set-env:
      #   ODATA_MAX_SERVICES     — e.g. 200
      #   ODATA_SERVICE_PATTERNS — e.g. Z* (client-specific pattern)
      #   DESTINATION_NAME       — name of the BTP Destination pointing to client ABAP system
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build
      ignore:
        - node_modules/
        - .git/
        - mta_archives/
    requires:
      - name: sap-mcp-destination-SBX
      - name: sap-mcp-connectivity-SBX
      - name: sap-mcp-xsuaa-SBX
    provides:
      - name: sap-mcp-server-api
        properties:
          url: ${default-url}

  # ── MCP Client Backend (also serves static UI) ───────────────────────────────
  - name: fiori-chat-mcp-client
    type: nodejs
    path: fiori-chat-mcp-client
    parameters:
      disk-quota: 512M
      memory: 256M
    properties:
      MCP_SERVER_URL: ~{sap-mcp-server-api/url}
      LLM_BASE_URL: https://api.openai.com/v1
      LLM_MODEL: gpt-4o-mini
      # After deploy, set via cf set-env:
      #   LLM_API_KEY        — client's OpenAI API key
      #   MCP_CLIENT_ID      — XSUAA client ID (from sap-mcp-xsuaa-SBX service key)
      #   MCP_CLIENT_SECRET  — XSUAA client secret (from sap-mcp-xsuaa-SBX service key)
    build-parameters:
      ignore:
        - node_modules/
    requires:
      - name: poc-chat-xsuaa
      - name: sap-mcp-server-api
    provides:
      - name: fiori-chat-mcp-client-api
        properties:
          url: ${default-url}

  # ── App Router ───────────────────────────────────────────────────────────────
  - name: fiori-chat-router
    type: approuter.nodejs
    path: fiori-chat-router
    parameters:
      disk-quota: 256M
      memory: 128M
    requires:
      - name: poc-chat-xsuaa
      - name: fiori-chat-mcp-client-api
        group: destinations
        properties:
          name: mcp-client-backend
          url: ~{url}
          forwardAuthToken: true
          timeout: 120000
    provides:
      - name: fiori-chat-router-url
        properties:
          url: ${default-url}

resources:

  # ── Reuse existing MCP server services (already deployed in SBX) ─────────────
  - name: sap-mcp-destination-SBX
    type: org.cloudfoundry.existing-service

  - name: sap-mcp-connectivity-SBX
    type: org.cloudfoundry.existing-service

  - name: sap-mcp-xsuaa-SBX
    type: org.cloudfoundry.existing-service

  # ── New XSUAA for Chat App ───────────────────────────────────────────────────
  - name: poc-chat-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      service-name: poc-chat-xsuaa-${space}
      path: ./xs-security.json
      config:
        xsappname: fiori-chat-poc-${space}
        tenant-mode: dedicated
